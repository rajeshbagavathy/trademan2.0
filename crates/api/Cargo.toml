[package]
name = "api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
broker-api = { path = "../broker-api" }
tradecore = { path = "../core" }
strategy = { path = "../strategy" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
